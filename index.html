<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ace Money Shooter</title>
<style>
  :root { --bg:#0d2b30; --gold:#f2b705; --coral:#ff5a4e; --mint:#7ee0b5; --ink:#e9f3ef; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; font-family:Verdana, Geneva, sans-serif; color:var(--ink); touch-action:none; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:12px 16px; font-size:18px; font-weight:bold; pointer-events:none; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  #hud .gold { color:var(--gold); }
  #hud .lives { color:var(--coral); letter-spacing:3px; }
  #panel { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; background:rgba(13,43,48,.88); }
  #panel h1 { font-size:clamp(34px, 8vw, 64px); color:var(--gold); letter-spacing:1px; }
  #panel p { max-width:420px; line-height:1.5; font-size:16px; }
  #panel .score { font-size:22px; color:var(--mint); }
  button { font:inherit; font-weight:bold; font-size:18px; padding:14px 34px; border:0; border-radius:8px; background:var(--gold); color:#2a1d00; cursor:pointer; }
  button:hover { background:#ffd23f; }
  button:focus-visible { outline:3px solid var(--mint); outline-offset:3px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <span>Cash: <span class="gold" id="score">$0</span></span>
  <span class="lives" id="lives"></span>
  <span>Best: <span class="gold" id="best">$0</span></span>
</div>

<div id="panel">
  <h1 id="title">Ace Money Shooter</h1>
  <p id="msg">Your ship fires on its own. Move it to dodge and shoot the red raiders before they reach the bottom. Every hit earns cash.</p>
  <p id="how">Move: mouse, finger drag, or arrow keys / A and D.</p>
  <div class="score hidden" id="final"></div>
  <button id="go">Start game</button>
</div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (player) player.y = H - 90;
  }

  var $ = function (id) { return document.getElementById(id); };
  var hud = $('hud'), panel = $('panel'), scoreEl = $('score'), livesEl = $('lives'), bestEl = $('best');

  var best = 0;
  try { best = parseInt(localStorage.getItem('ace-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = '$' + best;

  var player, bullets, enemies, particles, stars;
  var score, lives, running, last, spawnTimer, fireTimer, difficulty, invuln;
  var keys = {}, targetX = null;

  function reset() {
    player = { x: W / 2, y: H - 90, w: 34, speed: 520 };
    bullets = []; enemies = []; particles = [];
    stars = [];
    for (var i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + .4 });
    score = 0; lives = 3; spawnTimer = 0; fireTimer = 0; difficulty = 0; invuln = 0;
    targetX = null;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = '$' + score;
    livesEl.textContent = lives > 0 ? new Array(lives + 1).join('\u2665 ').trim() : '';
    bestEl.textContent = '$' + best;
  }

  function spawnEnemy() {
    var big = Math.random() < 0.18 + difficulty * 0.02;
    var size = big ? 46 : 30;
    enemies.push({
      x: size + Math.random() * (W - size * 2),
      y: -size,
      size: size,
      hp: big ? 3 : 1,
      maxHp: big ? 3 : 1,
      vy: (big ? 70 : 110) + difficulty * 9 + Math.random() * 40,
      sway: Math.random() * Math.PI * 2,
      value: big ? 30 : 10
    });
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .5 + Math.random() * .4, color: color });
    }
  }

  function update(dt) {
    difficulty += dt * 0.06;
    if (invuln > 0) invuln -= dt;

    // movement
    var move = 0;
    if (keys.ArrowLeft || keys.a) move -= 1;
    if (keys.ArrowRight || keys.d) move += 1;
    if (move) { player.x += move * player.speed * dt; targetX = null; }
    else if (targetX !== null) {
      var dx = targetX - player.x;
      player.x += Math.max(-player.speed * 1.6 * dt, Math.min(player.speed * 1.6 * dt, dx));
    }
    player.x = Math.max(player.w, Math.min(W - player.w, player.x));

    // auto fire
    fireTimer -= dt;
    if (fireTimer <= 0) {
      bullets.push({ x: player.x, y: player.y - 24 });
      fireTimer = 0.22;
    }
    for (var i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 720 * dt;
      if (bullets[i].y < -20) bullets.splice(i, 1);
    }

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(0.35, 1.0 - difficulty * 0.05);
    }

    // enemies
    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.y += e.vy * dt;
      e.sway += dt * 2;
      e.x += Math.sin(e.sway) * 30 * dt;

      // hit by bullet
      var dead = false;
      for (var b = bullets.length - 1; b >= 0; b--) {
        if (Math.abs(bullets[b].x - e.x) < e.size * 0.6 && Math.abs(bullets[b].y - e.y) < e.size * 0.6) {
          bullets.splice(b, 1);
          e.hp--;
          burst(e.x, e.y, '#ffd23f', 4);
          if (e.hp <= 0) { dead = true; break; }
        }
      }
      if (dead) {
        score += e.value;
        burst(e.x, e.y, '#ff5a4e', 16);
        enemies.splice(i, 1);
        if (score > best) { best = score; try { localStorage.setItem('ace-best', String(best)); } catch (err) {} }
        updateHud();
        continue;
      }

      // hits player
      if (invuln <= 0 && Math.abs(e.x - player.x) < e.size * 0.5 + 18 && Math.abs(e.y - player.y) < e.size * 0.5 + 18) {
        enemies.splice(i, 1);
        burst(player.x, player.y, '#7ee0b5', 24);
        loseLife();
        continue;
      }

      // reaches bottom
      if (e.y > H + e.size) {
        enemies.splice(i, 1);
        loseLife();
      }
    }

    // particles
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // stars
    for (i = 0; i < stars.length; i++) {
      stars[i].y += stars[i].s * 40 * dt;
      if (stars[i].y > H) { stars[i].y = 0; stars[i].x = Math.random() * W; }
    }
  }

  function loseLife() {
    lives--;
    invuln = 1.2;
    updateHud();
    if (lives <= 0) endGame();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(233,243,239,.55)';
    for (var i = 0; i < stars.length; i++) ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);

    // bullets
    ctx.fillStyle = '#f2b705';
    for (i = 0; i < bullets.length; i++) ctx.fillRect(bullets[i].x - 2, bullets[i].y - 10, 4, 14);

    // enemies
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i], s = e.size;
      ctx.fillStyle = e.maxHp > 1 ? '#c93a30' : '#ff5a4e';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y + s / 2);
      ctx.lineTo(e.x - s / 2, e.y - s / 2);
      ctx.lineTo(e.x + s / 2, e.y - s / 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#0d2b30';
      ctx.fillRect(e.x - s * 0.22, e.y - s * 0.25, s * 0.14, s * 0.14);
      ctx.fillRect(e.x + s * 0.08, e.y - s * 0.25, s * 0.14, s * 0.14);
      if (e.maxHp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,.4)';
        ctx.fillRect(e.x - s / 2, e.y - s / 2 - 8, s, 4);
        ctx.fillStyle = '#7ee0b5';
        ctx.fillRect(e.x - s / 2, e.y - s / 2 - 8, s * (e.hp / e.maxHp), 4);
      }
    }

    // player (blinks while protected)
    if (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0) {
      ctx.fillStyle = '#7ee0b5';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 26);
      ctx.lineTo(player.x + player.w / 2 + 4, player.y + 18);
      ctx.lineTo(player.x, player.y + 8);
      ctx.lineTo(player.x - player.w / 2 - 4, player.y + 18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f2b705';
      ctx.fillRect(player.x - 3, player.y - 6, 6, 10);
    }

    // particles
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    if (!running) return;
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    if (running) draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    reset();
    panel.classList.add('hidden');
    hud.classList.remove('hidden');
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    draw();
    hud.classList.add('hidden');
    $('title').textContent = 'Game over';
    $('msg').textContent = score >= best && score > 0 ? 'New best score!' : 'Raiders got through. Try again.';
    $('how').classList.add('hidden');
    $('final').classList.remove('hidden');
    $('final').textContent = 'You earned $' + score + '  |  Best: $' + best;
    $('go').textContent = 'Play again';
    panel.classList.remove('hidden');
    $('go').focus();
  }

  // input
  window.addEventListener('keydown', function (e) {
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = true;
    if (k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();
    if ((k === 'Enter' || k === ' ') && !running && document.activeElement !== $('go')) startGame();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = false;
  });
  canvas.addEventListener('pointermove', function (e) { targetX = e.clientX; });
  canvas.addEventListener('pointerdown', function (e) { targetX = e.clientX; });
  window.addEventListener('resize', resize);
  $('go').addEventListener('click', startGame);

  resize();
  reset();
  draw();
})();
</script>
</body>
</html>
